<div class="rounded-md border border-gray-300 overflow-hidden w-fit">
  <table>
    <thead app-header [columns]="columns"></thead>
    <tbody>
      <tr
        *ngFor="let row of data; index as i"
        app-row
        [columns]="columns"
        [row]="row"
        [class.bg-gray-100]="i % 2 === 0"
      ></tr>
    </tbody>
  </table>
</div>
